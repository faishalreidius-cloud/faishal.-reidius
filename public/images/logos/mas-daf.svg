<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <!-- Red Box: MAS -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="150" height="80" fill="#E30613" rx="2" />
    <rect x="4" y="4" width="142" height="72" stroke="#FFFFFF" stroke-width="3" fill="none" />
    <!-- Stylized MAS Text -->
    <text x="75" y="58" text-anchor="middle" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-size="46" font-style="italic" font-weight="900" fill="#FFFFFF" letter-spacing="-1px">MAS</text>
    <!-- Registered Mark -->
    <circle cx="132" cy="22" r="6" stroke="#FFFFFF" stroke-width="1.2" fill="none" />
    <text x="132" y="25" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">R</text>
  </g>
  
  <!-- Blue Box: DAF -->
  <g transform="translate(170, 10)">
    <rect x="0" y="0" width="150" height="80" fill="#00338D" rx="2" />
    <rect x="4" y="4" width="142" height="72" stroke="#FFFFFF" stroke-width="3" fill="none" />
    <!-- Bold DAF Text -->
    <text x="75" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-1px">DAF</text>
    <!-- Registered Mark -->
    <circle cx="132" cy="22" r="6" stroke="#FFFFFF" stroke-width="1.2" fill="none" />
    <text x="132" y="25" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">R</text>
  </g>
</svg>
